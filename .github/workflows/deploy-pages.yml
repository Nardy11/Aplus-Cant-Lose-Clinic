name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["Frontend/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Build
        env:
          CI: false # don't fail the build on lint warnings
          # Set this repo variable to your hosted backend, e.g. https://my-api.onrender.com/api
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
        run: npm run build
      # GitHub Pages has no SPA fallback; serving index.html as 404.html makes deep links work.
      - run: cp build/index.html build/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
